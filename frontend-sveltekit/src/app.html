<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151619" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Display preferences before the first paint, so nothing flashes (PRD R3.2). Keep it in step
      with src/lib/preferences.ts. The CSP allows it by its hash, which scripts/postbuild.mjs reads
      from the built pages, so editing it needs nothing else.
    -->
    <script>
      try {
        var t = localStorage.getItem('starter:theme');
        var s = localStorage.getItem('starter:text');
        var r = document.documentElement;
        if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
        if (s === 'sm' || s === 'lg' || s === 'xl') r.setAttribute('data-text', s);
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
