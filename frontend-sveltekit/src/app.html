<!doctype html>
<html lang="en" data-theme="fusion">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1628" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Display preferences before the first paint, so nothing flashes (PRD R3.2). Keep it in step
      with src/lib/preferences.ts and the themes in src/lib/themes/index.ts (`data-theme` above is
      the default theme). The CSP allows it by its hash, which scripts/postbuild.mjs reads from
      the built pages, so editing it needs nothing else.
    -->
    <script>
      try {
        var themes = ['fusion'];
        var t = localStorage.getItem('starter:theme');
        var m = localStorage.getItem('starter:mode');
        var s = localStorage.getItem('starter:text');
        var r = document.documentElement;
        if (themes.indexOf(t) >= 0) r.setAttribute('data-theme', t);
        if (m === 'light' || m === 'dark') r.setAttribute('data-mode', m);
        if (s === 'sm' || s === 'lg' || s === 'xl') r.setAttribute('data-text', s);
        // The language (#lib/i18n): its code, and right to left for the scripts written that way.
        var l = localStorage.getItem('starter:locale');
        if (l && /^[A-Za-z-]{2,20}$/.test(l)) {
          r.setAttribute('lang', l);
          if (/^(ar|ur|fa|he|ps|sd|ug|yi|dv|ckb)(-|$)/i.test(l)) r.setAttribute('dir', 'rtl');
        }
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
